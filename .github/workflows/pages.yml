name: Build and deploy site

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

# Allow one deploy at a time; let a running deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/configure-pages@v5

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Check for broken internal links
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --allow-hash-href \
            --ignore-empty-alt \
          || echo "::warning::htmlproofer reported issues (not blocking the deploy)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
