title: The Hyphal Tip
tagline: Fungal genomes, tools, and notes
description: >-
  Tools, data, and notes for researchers working on fungal and oomycete genomes.
url: https://fungalgenomes.org
baseurl: ""
lang: en_US

author:
  name: Jason Stajich

# Section list. Drives the masthead nav and the branching hypha on the home page.
nav:
  - title: Tools
    url: /tools/
    note: Genome portals, annotation, and prediction parameters
  - title: Notes
    url: /notes/
    note: Posts on fungal genomics and lab practice
  - title: WRIFO
    url: /wrifo/
    note: Women Researchers in Fungi & Oomycetes

permalink: /notes/:year/:month/:title/

# WRIFO directory. The Google Form collects additions and corrections; paste the
# form's public "send" link here and the contribute page picks it up. Leave it
# empty and that page falls back to the GitHub issue route only.
wrifo:
  form_url: "https://forms.gle/H9mcg3rYqFNrE6Ee8"
  repo: hyphaltip/fungalgenomes.org

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: /feed.xml

sass:
  style: compressed

exclude:
  - wrifo/scripts          # build tooling, not site content
  - wrifo/sources          # verbatim upstream dumps, superseded by wrifo/data
  - wrifo/data/incoming.csv    # form submissions awaiting curation
  - wrifo/data/ingest_log.csv  # who submitted what, and when
  - wrifo/WRiFO.xlsx       # source workbook; carries threaded comments
  - wrifo/airtable_dump.txt
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
