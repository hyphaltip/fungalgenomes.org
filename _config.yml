title: The Hyphal Tip
tagline: Fungal genomes, tools, and notes
description: >-
  Tools, data, and notes for researchers working on fungal and oomycete genomes.
url: https://fungalgenomes.org
baseurl: ""
lang: en_US

author:
  name: Jason Stajich

# Section list. Drives the masthead nav and the branching hypha on the home page.
nav:
  - title: Tools
    url: /tools/
    note: Genome portals, annotation, and prediction parameters
  - title: Notes
    url: /notes/
    note: Posts on fungal genomics and lab practice
  - title: WRIFO
    url: /wrifo/
    note: Women Researchers in Fungi & Oomycetes

permalink: /notes/:year/:month/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: /feed.xml

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
